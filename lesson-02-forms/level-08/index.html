<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lesson 02 — Level 08</title>
  </head>
  <body>
    <h1>Feedback for the show</h1>
    <form>
      <fieldset>
        <legend>Rating</legend>
        <label>
          Good:
          <input type="radio" name="rating" />
        </label>

        <label>
          Bad:
          <input type="radio" name="rating" />
        </label>
      </fieldset>

      <fieldset>
        <legend>Shows</legend>
        <label for="friday-show">Did you watch the show on Friday?</label>
        <input id="friday-show" type="checkbox" /> (Check for YES. Uncheck for
        NO.)
        <br />
        <label for="saturday-show">Did you watch the show on Saturday?</label>
        <input id="saturday-show" type="checkbox" /> (Check for YES. Uncheck for
        NO.)
      </fieldset>

      <button type="submit">Submit rating</button>
      <!-- TODO: Group related controls using <fieldset> and describe the group with <legend> -->
    </form>
  </body>
</html>
